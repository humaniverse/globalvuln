name: Update vulnerability indices

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: globalvuln-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::targets
            any::rcmdcheck
          needs: check

      - name: Run data pipeline
        run: targets::tar_make()
        shell: Rscript {0}

      - name: Validate published board
        run: Rscript data-raw/validate-pins-board.R data-published

      - name: Run source and pipeline contract tests
        run: testthat::test_local(stop_on_failure = TRUE)
        shell: Rscript {0}

      - name: Run package tests and check
        run: rcmdcheck::rcmdcheck(args = c("--no-manual"), error_on = "warning")
        shell: Rscript {0}

      - name: Write workflow summary
        if: always()
        run: cat artifacts/update-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Detect approved-data changes
        id: changes
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data data-raw/approved data-published inst/extdata/source_manifest.csv)" ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for an existing automated update PR
        if: steps.changes.outputs.found == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          count=$(gh pr list --state open --search 'label:automated-data-update' --json number --jq length)
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Create update branch and pull request
        if: steps.changes.outputs.found == 'true' && steps.existing.outputs.count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          branch="data-update/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "Reusing update branch created by an earlier run attempt: $branch"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$branch"
            git add data data-raw/approved data-published inst/extdata/source_manifest.csv
            git commit -m "Data update: approved vulnerability indices"
            git push --set-upstream origin "$branch"
          fi
          gh label create automated-data-update --color 1D76DB --force
          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$branch" \
            --title "Data update: approved vulnerability indices" \
            --body-file artifacts/update-summary.md \
            --label automated-data-update

      - name: Report deferred overlapping update
        if: steps.changes.outputs.found == 'true' && steps.existing.outputs.count != '0'
        run: echo "An automated data update PR is already open; this candidate was not published." >> "$GITHUB_STEP_SUMMARY"
