name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure Ubuntu package mirrors
        run: |
          # Avoid Ubuntu DNS outages during R setup: https://github.com/actions/runner-images/issues/15296
          printf '%s\tpriority:%s\n' \
            'https://mirrors.edge.kernel.org/ubuntu/' 1 \
            'https://archive.ubuntu.com/ubuntu/' 2 \
            'https://security.ubuntu.com/ubuntu/' 3 \
            | sudo tee /etc/apt/apt-mirrors.txt
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "15";' \
            'Acquire::https::Timeout "15";' \
            | sudo tee /etc/apt/apt.conf.d/zz-retries

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Run source and pipeline contract tests
        run: testthat::test_local(stop_on_failure = TRUE)
        shell: Rscript {0}

      - name: Check package
        run: rcmdcheck::rcmdcheck(args = c("--no-manual"), error_on = "warning")
        shell: Rscript {0}
